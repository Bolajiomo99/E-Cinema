name: Secrets check

# Confirms each account secret is set and works. Prints only status values, never a secret.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/secrets-check.yml
      - web/scripts/paypal-sandbox-smoke.mjs
      - web/lib/**
      - web/app/api/**

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Secret names only (never values)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: echo "$ALL" | jq -r 'keys[]' | grep -v '^github_token$'

  present:
    runs-on: ubuntu-latest
    steps:
      - name: Which secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          SMILE_ID_PARTNER_ID: ${{ secrets.SMILE_ID_PARTNER_ID }}
          SMILE_ID_API_KEY: ${{ secrets.SMILE_ID_API_KEY }}
        run: |
          for n in CLOUDFLARE_API_TOKEN AZURE_CREDENTIALS MAPBOX_TOKEN ANTHROPIC_API_KEY RESEND_API_KEY TERMII_API_KEY SMILE_ID_PARTNER_ID SMILE_ID_API_KEY; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: missing"; fi
          done

  cloudflare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        token: [CLOUDFLARE_API_TOKEN1]
    env:
      CF_TOKEN: ${{ secrets[matrix.token] }}
    steps:
      - name: Token valid and zone visible
        run: |
          [ -n "$CF_TOKEN" ] || { echo "missing"; exit 0; }
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | jq '{success, status: .result.status}'
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=e-cinema.net" | jq '{success, zones: [.result[] | {name, status}]}'
          Z=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=e-cinema.net" | jq -r '.result[0].id')
          A=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=e-cinema.net" | jq -r '.result[0].account.id')
          echo "DNS records:"; curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?per_page=100" | jq -c '{success, errors: [.errors[]?.message], records: [.result[]? | {type, name, proxied}]}'
          for s in ssl always_use_https min_tls_version security_level browser_check; do
            echo -n "$s: "; curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/settings/$s" | jq -c '{v: .result.value, err: [.errors[]?.message]}'
          done
          echo -n "Email routing: "; curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$Z/email/routing" | jq -c '{enabled: .result.enabled, status: .result.status, err: [.errors[]?.message]}'
          echo -n "R2 buckets: "; curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets" | jq -c '{buckets: [.result.buckets[]?.name], err: [.errors[]?.message]}'
          echo -n "Token permissions: "; curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq -c '.result.status'

  cloudflare-harden:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN1 }}
    steps:
      - name: HTTPS only and TLS 1.2 minimum
        run: |
          Z=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=e-cinema.net" | jq -r '.result[0].id')
          for kv in always_use_https:on min_tls_version:1.2; do
            k=${kv%%:*}; v=${kv#*:}
            echo -n "$k -> $v: "; curl -sS -X PATCH -H "Authorization: Bearer $CF_TOKEN" -H 'Content-Type: application/json' -d "{\"value\":\"$v\"}" "https://api.cloudflare.com/client/v4/zones/$Z/settings/$k" | jq -c '{ok: .success, now: .result.value, err: [.errors[]?.message]}'
          done

  azure:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret shape
        env:
          AZ: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          [ -n "$AZ" ] || { echo "AZURE_CREDENTIALS missing"; exit 1; }
          echo "$AZ" | jq -e 'has("clientId") and has("clientSecret") and has("tenantId") and has("subscriptionId")' >/dev/null && echo "JSON has clientId, clientSecret, tenantId, subscriptionId" || { echo "JSON is missing a field"; exit 1; }
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Who am I and which regions are allowed
        run: |
          az account show --query "{subscription: name, state: state, tenant: tenantDisplayName}" -o json
          az role assignment list --assignee "$(az account show --query user.name -o tsv)" --query "[].{role: roleDefinitionName}" -o json
          for r in westeurope eastus southafricanorth; do
            az account list-locations --query "[?name=='$r'].{name: name, display: displayName}" -o tsv
          done

  mapbox:
    runs-on: ubuntu-latest
    env:
      MB: ${{ secrets.MAPBOX_API_TOKEN || secrets.MAPBOX_TOKEN }}
    steps:
      - name: Token valid and its type
        run: |
          [ -n "$MB" ] || { echo "MAPBOX_API_TOKEN missing"; exit 1; }
          case "$MB" in pk.*) echo "Type: public token (pk.), right for maps in the app";; sk.*) echo "Type: secret token (sk.), only for server use";; *) echo "Type: not a Mapbox access token (should start with pk. or sk.)";; esac
          curl -sS "https://api.mapbox.com/tokens/v2?access_token=$MB" | jq '{code, usage: .token.usage, user: .token.user}'

  paypal:
    runs-on: ubuntu-latest
    env:
      # The sandbox Client ID is public; the secret stays in GitHub.
      CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX || secrets.PAYPAL_CLIENT_ID || 'BAAkg7gubXD57xmEp5UyefayM8NffeNsv7Ywf5GIQqLqSxEKqCG37uKNAFTctf2YgkyXqyi5zTIx9D-8Pg' }}
      S1: ${{ secrets.PAYPAL_CLIENT_SECRET }}
      S2: ${{ secrets.PAYPAL_SECRET }}
      S3: ${{ secrets.PAYPAL_SANDBOX_SECRET }}
      S4: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
      HAS_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX != '' }}
    steps:
      - name: Secret pairs with the Client ID
        run: |
          echo "PAYPAL_CLIENT_ID_SANDBOX secret set: $HAS_ID"
          v="${S4}"
          echo "Client ID: ${#CLIENT_ID} chars, looks like a Client ID: $([[ "$CLIENT_ID" == E* ]] && echo "no, it looks like a Secret" || echo yes), whitespace: $([[ "$CLIENT_ID" =~ [[:space:]] ]] && echo yes || echo no)"
          echo "Sandbox secret: ${#v} chars, same as Client ID: $([ "$v" = "$CLIENT_ID" ] && echo yes || echo no), whitespace: $([[ "$v" =~ [[:space:]] ]] && echo yes || echo no)"
          names=(PAYPAL_CLIENT_SECRET PAYPAL_SECRET PAYPAL_SANDBOX_SECRET PAYPAL_CLIENT_SECRET_SANDBOX)
          vals=("$S1" "$S2" "$S3" "$S4")
          for i in 0 1 2 3; do
            [ -n "${vals[$i]}" ] || { echo "${names[$i]}: missing"; continue; }
            for env in sandbox live; do
              host=api-m.paypal.com; [ $env = sandbox ] && host=api-m.sandbox.paypal.com
              body=$(curl -s -w '\n%{http_code}' -u "$CLIENT_ID:${vals[$i]}" -d grant_type=client_credentials "https://$host/v1/oauth2/token")
              code=$(echo "$body" | tail -1); err=$(echo "$body" | head -1 | jq -r '.error // empty' 2>/dev/null)
              echo "${names[$i]} on $env: HTTP $code ${err:+($err)} (200 = matches)"
            done
          done
      - name: Live credentials
        env:
          LIVE_ID: ${{ secrets.PAYPAL_CLIENT_ID_LIVE }}
          LIVE_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_LIVE }}
        run: |
          [ -n "$LIVE_ID" ] && [ -n "$LIVE_SECRET" ] || { echo "PAYPAL_CLIENT_ID_LIVE / PAYPAL_CLIENT_SECRET_LIVE: not both set yet"; exit 0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "$LIVE_ID:$LIVE_SECRET" -d grant_type=client_credentials https://api-m.paypal.com/v1/oauth2/token)
          echo "Live login: HTTP $code (200 = matches)"

  paypal-checkout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Sandbox order through the app's PayPal SDK
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
        run: node scripts/paypal-sandbox-smoke.mjs
      - name: Build the web app
        run: npm run build
      - name: Concierge books seats end to end (Claude + PayPal sandbox)
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null localhost:3100/concierge && break; sleep 1; done
          curl -s -XPOST localhost:3100/api/paypal/orders -H 'content-type: application/json' \
            -d '{"showtimeId":"red-earth-2026-11-02"}' | jq -r '"checkout route: " + (if .orderId then "order created" else .error end)'
          curl -s -XPOST localhost:3100/api/concierge -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"Please book 2 seats for Red Earth."}]}' > reply.json
          jq -r '"concierge orders: \(.orders | length), total: \(.orders[0].currency // "") \(.orders[0].total // "-"), refused: \(.refused)"' reply.json
          jq -r '.messages[-1].content[] | select(.type=="text") | .text' reply.json | head -5
          test "$(jq '.orders | length' reply.json)" -ge 1 || { tail -20 server.log; exit 1; }

  services:
    runs-on: ubuntu-latest
    env:
      TERMII: ${{ secrets.TERMII_API_KEY }}
      RESEND: ${{ secrets.RESEND_API_KEY }}
      ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
      SID_PARTNER: ${{ secrets.SMILE_ID_PARTNER_ID }}
      SID_KEY_A: ${{ secrets.SMILE_ID_API_KEY }}
      SID_KEY_B: ${{ secrets.SMILE_ID_API_TOKEN }}
      SID_KEY_C: ${{ secrets.SMILE_ID_API_KEY1 }}
      SUMSUB_T: ${{ secrets.SUMSUB_APP_TOKEN }}
      SUMSUB_K: ${{ secrets.SUMSUB_SECRET_KEY }}
      R2_KID: ${{ secrets.R2_ACCOUNT_KEY_ID }}
      R2_SECRET: ${{ secrets.R2_ACCOUNT_TOKEN }}
      R2_API: ${{ secrets.R2_ACCOUNT_TOKEN_VALUE }}
    steps:
      - name: Termii
        run: |
          [ -n "$TERMII" ] || { echo "TERMII_API_KEY missing"; exit 0; }
          echo -n "Balance call: "; curl -s -o /tmp/b -w '%{http_code}' "https://api.ng.termii.com/api/get-balance?api_key=$TERMII"; echo " $(jq -c '{currency, has_balance: (.balance != null), message}' /tmp/b 2>/dev/null)"
          echo -n "Sender IDs: "; curl -s "https://api.ng.termii.com/api/sender-id?api_key=$TERMII" | jq -c '[.data[]? | {sender_id, status}]' 2>/dev/null || echo "could not read"
      - name: Resend
        run: |
          [ -n "$RESEND" ] || { echo "RESEND_API_KEY missing"; exit 0; }
          echo -n "Domains call: "; curl -s -o /tmp/r -w '%{http_code}' -H "Authorization: Bearer $RESEND" https://api.resend.com/domains; echo " $(jq -c '{domains: [.data[]? | {name, status, region}], error: .name}' /tmp/r 2>/dev/null)"
      - name: Anthropic
        run: |
          [ -n "$ANTHROPIC" ] || { echo "ANTHROPIC_API_KEY missing"; exit 0; }
          echo -n "Models call: "; curl -s -o /tmp/a -w '%{http_code}' -H "x-api-key: $ANTHROPIC" -H "anthropic-version: 2023-06-01" https://api.anthropic.com/v1/models; echo " $(jq -c '{models: (.data | length?), error: .error.type}' /tmp/a 2>/dev/null)"
      - name: Smile ID
        run: |
          echo "Partner ID: ${#SID_PARTNER} chars, numeric: $([[ "$SID_PARTNER" =~ ^[0-9]+$ ]] && echo yes || echo 'no (Smile ID partner IDs are short numbers)')"
          for kn in A B C; do
            v="SID_KEY_$kn"; SID_KEY="${!v}"; [ -n "$SID_KEY" ] || continue
            case $kn in A) echo "Key SMILE_ID_API_KEY:";; B) echo "Key SMILE_ID_API_TOKEN:";; C) echo "Key SMILE_ID_API_KEY1:";; esac
            for host in testapi.smileidentity.com api.smileidentity.com; do
              ts=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)
              sig=$(printf '%s%s%s' "$ts" "$SID_PARTNER" "sid_request" | openssl dgst -sha256 -hmac "$SID_KEY" -binary | base64)
              body=$(jq -nc --arg s "$sig" --arg t "$ts" --arg p "$SID_PARTNER" '{signature:$s, timestamp:$t, partner_id:$p, user_id:"check-user", job_id:"check-job", image_links:false, history:false}')
              echo -n "  $host: "; curl -s -o /tmp/s -w '%{http_code}' -H 'Content-Type: application/json' -d "$body" "https://$host/v1/job_status"; echo " $(jq -c '{code, error}' /tmp/s 2>/dev/null)"
            done
          done
      - name: Sumsub
        run: |
          [ -n "$SUMSUB_T" ] && [ -n "$SUMSUB_K" ] || { echo "Sumsub keys not both set"; exit 0; }
          ts=$(date +%s); path="/resources/accessTokens/sdk"; body='{"userId":"e-cinema-check","levelName":"basic-kyc-level","ttlInSecs":60}'
          sig=$(printf '%s%s%s%s' "$ts" "POST" "$path" "$body" | openssl dgst -sha256 -hmac "$SUMSUB_K" | sed 's/^.*= //')
          echo -n "Sumsub token call: "; curl -s -o /tmp/u -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H "X-App-Token: $SUMSUB_T" -H "X-App-Access-Ts: $ts" -H "X-App-Access-Sig: $sig" -d "$body" "https://api.sumsub.com$path"; echo " $(jq -c '{got_token: (.token != null), error: .description}' /tmp/u 2>/dev/null)"
          echo "Mode: $([[ "$SUMSUB_T" == sbx:* ]] && echo sandbox || ([[ "$SUMSUB_T" == prd:* ]] && echo production || echo unknown))"
      - name: R2
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN1 }}
        run: |
          A=$(curl -fsS -H "Authorization: Bearer $CF" "https://api.cloudflare.com/client/v4/zones?name=e-cinema.net" | jq -r '.result[0].account.id')
          echo -n "R2 API token (R2_ACCOUNT_TOKEN_VALUE): "; curl -s -H "Authorization: Bearer $R2_API" "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets" | jq -c '{success, buckets: [.result.buckets[]?.name], err: [.errors[]?.message]}'
          echo -n "S3 keys (R2_ACCOUNT_KEY_ID + R2_ACCOUNT_TOKEN): "
          AWS_ACCESS_KEY_ID="$R2_KID" AWS_SECRET_ACCESS_KEY="$R2_SECRET" AWS_DEFAULT_REGION=auto aws s3api list-buckets --endpoint-url "https://$A.r2.cloudflarestorage.com" --query 'Buckets[].Name' --output json 2>&1 | tr -d '\n' | cut -c1-200; echo
