# Checks every pull request before it can be merged into any branch.
# Make these jobs "required status checks" in the branch ruleset so a failing PR cannot merge.
name: Merge guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: merge-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  no-ai-agents:
    name: No AI agent authors or files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits and new files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          agents='claude|anthropic|copilot|chatgpt|openai|gpt-[0-9]|codex|cursor|devin|gemini|aider|windsurf|codeium|tabnine|amazon ?q|coderabbit|sweep-ai|openhands|cline|qodo'
          fail=0
          for c in $(git rev-list "$BASE..$HEAD"); do
            who=$(git log -1 --format='%an <%ae> | %cn <%ce>' "$c")
            if echo "$who" | grep -Eiq "$agents" || echo "$who" | grep -Eq '\[bot\]' && ! echo "$who" | grep -q 'dependabot\[bot\]'; then
              echo "::error::Commit $c has an AI agent or bot as author/committer: $who"; fail=1
            fi
            msg=$(git log -1 --format=%B "$c")
            if echo "$msg" | grep -Ei '^(co-authored-by|generated-by|assisted-by|signed-off-by|ai-assisted):' | grep -Eiq "$agents"; then
              echo "::error::Commit $c credits an AI agent in its trailers"; fail=1
            fi
            if echo "$msg" | grep -Eiq 'generated (with|by) .*('"$agents"')|claude\.ai/code|claude-session:|🤖'; then
              echo "::error::Commit $c message says it was generated by an AI agent"; fail=1
            fi
          done
          added=$(git diff --name-only --diff-filter=A "$BASE...$HEAD" || true)
          bad=$(echo "$added" | grep -Ei '(^|/)(\.claude|\.cursor|\.aider[^/]*|\.windsurf|\.codeium|\.continue|\.clinerules|\.devin)(/|$)|(^|/)(CLAUDE|AGENTS|GEMINI)\.md$|\.cursorrules$|copilot-instructions\.md$' || true)
          if [ -n "$bad" ]; then
            echo "::error::This PR adds AI agent or CLI config files:"; echo "$bad"; fail=1
          fi
          [ "$fail" = 0 ] && echo "No AI agent authors, trailers or config files found."
          exit $fail

  secret-scan:
    name: Leaked keys and passwords
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the PR's commits with gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --log-opts="$BASE..$HEAD" --redact --verbose --exit-code 1

  malware-scan:
    name: Malware and risky files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --diff-filter=ACMR "$BASE...$HEAD" > changed.txt; cat changed.txt
      - name: Block executables and binaries
        run: |
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if echo "$f" | grep -Eiq '\.(exe|dll|so|dylib|bin|msi|scr|com|bat|cmd|ps1|vbs|jar|apk|dmg|iso)$'; then
              echo "::error::Executable file type not allowed: $f"; fail=1; continue
            fi
            magic=$(head -c 4 "$f" | od -An -tx1 | tr -d ' \n')
            case "$magic" in 7f454c46*|4d5a*|cafebabe*|cffaedfe*|feedfacf*)
              echo "::error::Binary executable content not allowed: $f"; fail=1;;
            esac
          done < changed.txt
          exit $fail
      - name: ClamAV scan of changed files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || sudo freshclam
          if [ -s changed.txt ]; then
            xargs -d '\n' -a changed.txt sh -c 'for f; do [ -f "$f" ] && printf "%s\n" "$f"; done' _ > scan.txt
            if [ -s scan.txt ]; then clamscan --infected --no-summary -f scan.txt; fi
          fi
          echo "ClamAV found nothing."

  dependency-review:
    name: Vulnerable dependencies
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
