name: Cloudflare check

# Confirms the CLOUDFLARE_API_TOKEN secret works and can see the e-cinema.net zone.
# Prints only status values, never the token.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cloudflare-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE: e-cinema.net
    steps:
      - name: Secret present
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          echo "Secret is set"
      - name: Token is valid
        run: |
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify \
            | jq '{success, status: .result.status, expires_on: .result.expires_on}'
      - name: Zone is visible
        run: |
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE" \
            | jq '{success, zones: [.result[] | {name, status, plan: .plan.name, name_servers}]}'
      - name: DNS records can be read
        run: |
          ZID=$(curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | jq -r '.result[0].id')
          curl -fsS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100" \
            | jq '{success, count: (.result | length), records: [.result[] | {type, name}]}'
