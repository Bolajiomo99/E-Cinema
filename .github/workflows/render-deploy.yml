name: Deploy to Render

# Creates or updates the E-Cinema project on Render (workspace "E-Cinema" only).
on:
  workflow_dispatch:
  push:
    paths: [ops/render-deploy.mjs, .github/workflows/render-deploy.yml]

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create or update Render resources
        id: render
        run: node ops/render-deploy.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY1 }}
          RENDER_OWNER_ID: tea-db7ej9e7bikc73ajmkmg
          DEPLOY_BRANCH: ${{ github.ref_name }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANNEL3_API_KEY: ${{ secrets.CHANNEL3_API_KEY }}
          NEXT_PUBLIC_AG_GRID_LICENSE_KEY: ${{ secrets.AG_GRID_LICENSE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCOUNT_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN1 }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
          SUMSUB_APP_TOKEN: ${{ secrets.SUMSUB_APP_TOKEN }}
          SUMSUB_SECRET_KEY: ${{ secrets.SUMSUB_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.GOOGLE_CONSOLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.GOOGLE_CONSOLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Test keys while PayPal is on sandbox; switch both to live together.
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY_TEST }}
          PAYSTACK_PUBLIC_KEY: pk_test_66c86e8b76bff2455c85a47a2c3a89da01c23157
          FLUTTERWAVE_SECRET_KEY: ${{ secrets.FLW_SECRET_KEY_TEST }}
          FLUTTERWAVE_WEBHOOK_HASH: ${{ secrets.FLW_WEBHOOK_HASH_TEST }}
          COINBASE_COMMERCE_API_KEY: ${{ secrets.COINBASE_COMMERCE_API_KEY }}
          # The public address: passkeys and Google sign-in are bound to it.
          WEBAUTHN_RP_ID: e-cinema.net
          WEBAUTHN_ORIGINS: https://e-cinema.net,https://www.e-cinema.net
          WEB_PUBLIC_URL: https://e-cinema.net
      - name: Smoke test the live services
        run: |
          curl -fsS "${{ steps.render.outputs.api_url }}/healthz"; echo
          curl -fsS "${{ steps.render.outputs.api_url }}/v1/showtimes" | head -c 300; echo
          # The web service can answer 502 for a short while after going live.
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.render.outputs.web_url }}/checkout")
            echo "checkout $code"
            [ "$code" = 200 ] && break
            [ "$i" = 18 ] && exit 1
            sleep 10
          done
          # Dub playback: the web app lists the AI dubs stored in R2 (may wait for a fresh deploy).
          for i in $(seq 1 30); do
            body=$(curl -s "${{ steps.render.outputs.web_url }}/api/dubs/red-earth-sample" || true)
            echo "dubs $body"
            echo "$body" | grep -q '"fr"' && break
            [ "$i" = 30 ] && exit 1
            sleep 10
          done
          # Accounts: sign up a throwaway viewer, read it back with the cookie, then sign out.
          web="${{ steps.render.outputs.web_url }}"
          api="${{ steps.render.outputs.api_url }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$web/signin")
            echo "signin $code"
            [ "$code" = 200 ] && break
            [ "$i" = 30 ] && exit 1
            sleep 10
          done
          jar=$(mktemp)
          email="smoke+$(date +%s)@e-cinema.net"
          curl -fsS -c "$jar" -H "content-type: application/json" -H "origin: $web" \
            -d "{\"name\":\"Smoke Test\",\"email\":\"$email\",\"password\":\"smoke-$(openssl rand -hex 12)\",\"terms\":true}" \
            "$web/api/auth/signup" | grep -q '"account"'
          curl -fsS -b "$jar" "$web/api/auth/me" | grep -q "$email"
          curl -fsS -b "$jar" -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/auth/identity/token" | grep -q '"token"'
          echo "face check token ok"
          curl -fsS -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/auth/passkeys/login/begin" | grep -q '"challengeId"'
          echo "passkeys ok"
          # Google sign-in: once the client secrets exist, start must hand off to Google.
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID || secrets.GOOGLE_CONSOLE_CLIENT_ID }}" ]; then
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "https://e-cinema.net/api/auth/google/start")
            echo "google start -> ${loc%%\?*}"
            echo "$loc" | grep -q '^https://accounts.google.com/' || exit 1
            echo "$loc" | grep -q 'redirect_uri=https%3A%2F%2Fe-cinema.net%2Fapi%2Fauth%2Fgoogle%2Fcallback' || exit 1
          fi
          # Legal pages Google links to.
          curl -fsS -o /dev/null https://e-cinema.net/privacy
          curl -fsS -o /dev/null https://e-cinema.net/terms
          echo "google and legal ok"
          # Pages and the watch room: a viewer without a ticket sees the gate and gets no room pass.
          curl -fsS -o /dev/null https://e-cinema.net/
          curl -fsS -o /dev/null https://e-cinema.net/releases
          curl -fsS -b "$jar" "$web/room/red-earth-2026-11-02" | grep -q "for ticket holders"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -X POST "$web/api/rooms/red-earth-2026-11-02/pass")" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.render.outputs.api_url }}/v1/rooms/red-earth-2026-11-02/live?t=forged.pass")" = 401 ]
          echo "home, releases and watch room gate ok"
          # Signed-in home: guests are sent to sign in, the viewer sees their home and seats.
          curl -s -o /dev/null -w '%{redirect_url}' https://e-cinema.net/home | grep -q '/signin'
          curl -fsS -b "$jar" "$web/home" | grep -q "Ask E-Cinema AI"
          curl -fsS -o /dev/null -b "$jar" "$web/api/me/tickets"
          curl -fsS "$web/api/calendar/the-last-harmattan-2026-11-01.ics" | grep -q "BEGIN:VCALENDAR"
          echo "my home, seats and calendar invite ok"
          # Plans: pick Pro, then PayPal must hand back a sandbox approval page for the subscription.
          curl -fsS -o /dev/null https://e-cinema.net/plans
          curl -fsS -b "$jar" -X PUT -H "content-type: application/json" -H "origin: $web" -d '{"plan":"pro"}' "$web/api/me/plan" >/dev/null
          sub=$(curl -sS -b "$jar" -H "content-type: application/json" -H "origin: $web" -d '{"cycle":"month"}' "$web/api/paypal/subscriptions")
          echo "subscription -> $(echo "$sub" | grep -o '"approve":"https://[^/"]*' || echo "$sub")"
          echo "$sub" | grep -q '"approve":"https://www.sandbox.paypal.com/' || exit 1
          echo "plans and PayPal subscription ok"
          # Checkout, live counts, watch parties and classic requests.
          curl -fsS "$web/checkout?film=red-earth-2026-11-02" | grep -q "Order summary"
          curl -fsS "${{ steps.render.outputs.api_url }}/v1/live" | grep -q '^\['
          party=$(curl -fsS -b "$jar" -H "content-type: application/json" -H "origin: $web" \
            -d '{"showtimeId":"red-earth-2026-11-02","name":"Smoke party","visibility":"link","rules":["spoiler-filter"]}' "$web/api/parties")
          code=$(echo "$party" | grep -o '"code":"[a-z0-9-]*"' | cut -d'"' -f4)
          echo "party -> $code"
          [ -n "$code" ]
          curl -fsS "$web/p/$code" | grep -q "Smoke party"
          curl -fsS -b "$jar" -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/parties/$code/end" >/dev/null
          curl -fsS "$web/classics" | grep -q "Bring back a classic"
          echo "checkout, live, parties and classics ok"
          # World map: page renders and the per-country audience feeds answer.
          curl -fsS "$web/map" | grep -q "Watching right now"
          curl -fsS "$web/api/live" | grep -q '^\['
          curl -fsS "$web/api/audience/tonight" | grep -q '^\['
          echo "world map ok"
          # Coming soon: pre-order prices render.
          curl -fsS "$web/coming-soon" | grep -q "Pre-order seat"
          curl -fsS "$web/preorder/iron-delta-2026-12-14" | grep -q "Choose how you watch"
          echo "coming soon and pre-order ok"
          # Payment failed page is for signed-in buyers: signed out it sends you to sign in.
          curl -s -o /dev/null -w '%{redirect_url}' "$web/checkout/failed?film=iron-delta-2026-12-14" | grep -q "/signin"
          echo "payment failed page ok"
          # 18+ titles unlock in four stages instead of a plain seat.
          curl -fsS "$web/film/velvet-hour-2026-11-02" | grep -q "Unlock in 4 stages"
          curl -s -o /dev/null -w '%{redirect_url}' "$web/unlock/velvet-hour-2026-11-02" | grep -q "/signin"
          echo "18+ unlock ok"
          # Sold-out page: a premiere with seats left sends you to checkout; the lottery API answers.
          curl -s -o /dev/null -w '%{redirect_url}' "$web/sold-out/lagos-lights-2026-11-04" | grep -q "/checkout"
          echo "sold-out lottery ok"
          # Gifts: the builder renders and an unknown gift code says so.
          curl -fsS "$web/gift" | grep -q "Build your gift"
          curl -fsS "$web/gift/redeem/ECG-0000-0000" | grep -q "could not find that gift"
          echo "gifts ok"
          # Student offer: the page renders, and Student Pro is refused until the viewer is verified.
          curl -fsS "$web/student" | grep -q "How to get it"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -X PUT -H "content-type: application/json" -H "origin: $web" -d '{"plan":"student"}' "$web/api/me/plan")" = 403 ]
          echo "student offer ok"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/rooms/red-earth-2026-11-02/quiz")" = 403 ]
          echo "lobby quiz ok"
          # Room panel: translations and shared files are for ticket holders only.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -H "content-type: application/json" -d '{"ids":[1]}' "$web/api/rooms/red-earth-2026-11-02/translate")" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/rooms/red-earth-2026-11-02/media?key=rooms/other/x.pdf")" = 404 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/rooms/red-earth-2026-11-02/catchup")" = 403 ]
          curl -fsS "${{ steps.render.outputs.api_url }}/v1/showtimes/red-earth-2026-11-02/reviews" | grep -q '"count"'
          echo "room panel ok"
          # Library: the empty shelf renders; keeping and rewatching need the film in the library; collections work.
          curl -fsS -b "$jar" "$web/library" | grep -q "Your library"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -H "content-type: application/json" -d '{"quality":"hd"}' "$web/api/library/red-earth-2026-11-02/keep")" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -H "content-type: application/json" -d "{\"showtimeId\":\"red-earth-2026-11-02\",\"startsAt\":\"$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)\"}" "$web/api/rewatch")" = 404 ]
          col=$(curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" -d '{"name":"Smoke shelf"}' "$web/api/collections" | sed -n 's/.*"id":"\([0-9a-f-]*\)".*/\1/p')
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -X DELETE "$web/api/collections/$col")" = 204 ]
          echo "library ok"
          # Downloads: the page renders and only kept films get a licence.
          curl -fsS -b "$jar" "$web/downloads" | grep -q "Encrypted to this device"
          curl -fsS -b "$jar" "$web/api/downloads" | grep -q '"downloads"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -X PUT -H "origin: $web" -H "content-type: application/json" -d '{"device":"smokesmokesmoke01","quality":"sd"}' "$web/api/downloads/red-earth-2026-11-02")" = 402 ]
          curl -fsS "$web/sw.js" | grep -q "ec-offline-v1"
          echo "downloads ok"
          # Insights: the page renders, a heartbeat for a real film counts, a bogus one is refused.
          curl -fsS -b "$jar" "$web/insights" | grep -q "Your insights"
          curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" -d '{"showtimeId":"red-earth-2026-11-02","mode":"room","seconds":5}' "$web/api/insights/beat" | grep -q '"counted"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -H "content-type: application/json" -d '{"showtimeId":"red-earth-2026-11-02","mode":"cinema","seconds":5}' "$web/api/insights/beat")" = 400 ]
          echo "insights ok"
          # Notifications: the page and the unread count work, mark-all answers 204, a bad id is refused.
          curl -fsS -b "$jar" "$web/notifications" | grep -q "Mark all read"
          curl -fsS -b "$jar" "$web/api/notifications/unread" | grep -q '"unread"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -X POST "$web/api/notifications/all/read")" = 204 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -X POST "$web/api/notifications/abc/read")" = 404 ]
          echo "notifications ok"
          # Messages: the page, the unread count, a live pass, call setup, and media refused for a stranger's key.
          for u in /messages /api/chat/unread /api/chat/pass /api/chat/ice; do
            code=$(curl -s -o /tmp/m.out -w '%{http_code}' -b "$jar" "$web$u"); echo "$u $code"
            [ "$code" = 200 ] || { head -c 300 /tmp/m.out; exit 1; }
          done
          curl -fsS -b "$jar" "$web/api/chat/pass" | grep -q '"ws":"wss://'
          curl -fsS -b "$jar" "$web/api/chat/ice" | grep -q 'stun:'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/chat/media?key=chat/00000000-0000-0000-0000-000000000000/00000000-0000-0000-0000-000000000000.png")" = 403 ]
          echo "messages ok"
          # Community: the feed and a starter group load, posting and liking work, a bad cursor is refused.
          curl -fsS -b "$jar" "$web/community" | grep -q "Communities"
          curl -fsS -b "$jar" "$web/community/nollywood-fans" | grep -q "About this group"
          curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" -X POST -d '{"community":"","kind":"text","body":"Smoke test post, please ignore"}' "$web/api/community/posts" > /tmp/post.json
          pid=$(node -e 'console.log(require("/tmp/post.json").id)')
          curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" -X POST -d '{"on":true}' "$web/api/community/posts/$pid/like" | grep -q '"likes":1'
          curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" -X POST -d '{}' "$web/api/community/posts/$pid/delete" -o /dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/community/posts?before=abc")" = 400 ]
          echo "community ok"
          # Profile: my page renders, editing works, an unknown person is a 404.
          curl -fsS -b "$jar" "$web/u/me" | grep -q "avg snack score"
          curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" -X POST -d '{"city":"Lagos","interests":"Thrillers, zobo","spoken":["English"]}' "$web/api/community/profile" | grep -q '"ok":true'
          curl -fsS -b "$jar" "$web/u/me" | grep -q "Thrillers, zobo"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/u/nobody.here.x")" = 404 ]
          echo "profile ok"
          # Shop the film: each tab answers with real products, an unknown film is refused.
          for tab in scene gifts; do
            curl -fsS "$web/api/shop?showtime=red-earth-2026-11-02&tab=$tab" | grep -q '"url":"https://'
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$web/api/shop?showtime=nope")" = 400 ]
          curl -fsS "$web/concierge?ask=hello" | grep -q "concierge"
          echo "shop ok"
          # E-Cinema store: catalog and product pages, cart, a Lagos address, a sandbox PayPal order,
          # then a pay-on-delivery order that is cancelled again; the order desk stays staff only.
          curl -fsS "$web/shop" | grep -q "Shop E-Cinema"
          curl -fsS "$web/shop/vr-headset" | grep -q "E-CINEMA VR HEADSET"
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$web/shop/no-such-product")" = 404 ]
          sj() { curl -fsS -b "$jar" -H "origin: $web" -H "content-type: application/json" "$@"; }
          sj -X PUT -d '{"productId":"popcorn-box","variant":"Butter · Zobo","qty":1,"add":true}' "$web/api/store/cart" | grep -q '"count":1'
          sj -X PUT -d '{"name":"Smoke Test","phone":"+234 801 000 0000","line1":"14 Admiralty Way","area":"Lekki","city":"Lagos","state":"Lagos","country":"NG"}' "$web/api/store/address" > /tmp/cart.json
          grep -q '"cod":true' /tmp/cart.json
          total=$(node -e 'console.log(require("/tmp/cart.json").totalNgn)')
          sj -X POST -d "{\"method\":\"paypal\",\"expectTotalNgn\":$total}" "$web/api/store/checkout" | grep -q '"orderId":"'
          sj -X POST -d "{\"method\":\"cod\",\"expectTotalNgn\":$total}" "$web/api/store/checkout" > /tmp/order.json
          oid=$(node -e 'const o=require("/tmp/order.json"); if(o.status!=="placed") process.exit(1); console.log(o.id)')
          sj -X POST -d '{}' "$web/api/store/orders/$oid/cancel" | grep -q '"status":"cancelled"'
          curl -fsS -b "$jar" "$web/shop/orders" | grep -q "Your orders"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/shop/ops")" = 404 ]
          echo "store ok"
          # Brand protection: the checker answers (an unissued code is not genuine), the rewards
          # page and report form load, partner shops are recognised, and the desk stays staff only.
          curl -fsS "$web/verify" | grep -q "VERIFY A PRODUCT"
          curl -fsS -H "origin: $web" -H "content-type: application/json" -X POST -d '{"code":"EC-QR-SMOK-E000"}' "$web/api/brand/verify" | grep -q '"reason":"never"'
          curl -fsS -H "origin: $web" -H "content-type: application/json" -X POST -d '{"code":"hello"}' "$web/api/brand/verify" | grep -q '"reason":"bad"'
          curl -fsS -b "$jar" "$web/rewards" | grep -q "Community rewards"
          curl -fsS -b "$jar" "$web/rewards/report" | grep -q "Report a fake seller"
          sj -X POST -d '{"link":"https://lagosthreads.ng","photos":[]}' "$web/api/brand/check" | grep -q "licensed partner"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/rewards/desk")" = 404 ]
          echo "brand ok"
          # Licensing: plans and agreement load, the apply flow opens for a member, a member
          # without a licence is sent to apply, and the licensing desk stays staff only.
          curl -fsS "$web/licensing" | grep -q "Choose Growth" || { echo "licensing page"; exit 1; }
          curl -fsS "$web/licensing/agreement" | grep -q "Merch licence agreement" || { echo "agreement page"; exit 1; }
          curl -fsSL -b "$jar" "$web/licensing/apply?plan=growth" | grep -q "Continue to plan" || { echo "apply page"; exit 1; }
          curl -sL -o /dev/null -w '%{url_effective}' -b "$jar" "$web/partner" | grep -q "/licensing/apply" || { echo "partner redirect"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/licensing/desk")" = 404 ] || { echo "desk not 404"; exit 1; }
          echo "licensing ok"
          # Legal pages and cookie choices (Figma 92:841 to 92:1350).
          for pg in terms privacy cookies refunds legal/kids legal/studios legal/community; do
            curl -fsS "$web/$pg" | grep -q 'class="lp lg"' || { echo "legal $pg"; exit 1; }
          done
          curl -fsS "$web/cookies" | grep -q "Reject all extras" || { echo "cookie choices"; exit 1; }
          echo "legal ok"
          # Company pages, careers and business quotes (Figma 94:947 to 94:1239, 114:1273 to 114:1531).
          curl -fsS "$web/about" | grep -q "PREMIERES, TOGETHER." || { echo "about"; exit 1; }
          curl -fsS "$web/for-studios" | grep -q "How it works" || { echo "for studios"; exit 1; }
          curl -fsS "$web/careers" | grep -q "Open roles" || { echo "careers"; exit 1; }
          curl -fsS "$web/careers/jobs" | grep -q "How roles are shared" || { echo "jobs board"; exit 1; }
          curl -fsS "$web/business" | grep -q "Get a quote" || { echo "business"; exit 1; }
          curl -fsS "$api/v1/jobs" | grep -q '"ngShare"' || { echo "jobs api"; exit 1; }
          curl -fsS "$api/v1/about" | grep -q '"members"' || { echo "about api"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/careers/desk")" = 404 ] || { echo "hiring desk not 404"; exit 1; }
          curl -fsS -b "$jar" "$web/help/refund" | grep -q "Request a refund" || { echo "refund page"; exit 1; }
          echo "company ok"
          # Family and kids (Figma 89:1020).
          curl -fsS -b "$jar" "$web/api/family" | grep -q '"pinSet"' || { echo "family api"; exit 1; }
          curl -fsS -b "$jar" "$web/family" | grep -q "Family and kids" || { echo "family page"; exit 1; }
          curl -fsS -b "$jar" "$web/kids" | grep -q "Moonlight Fox" || { echo "kids cinema"; exit 1; }
          echo "family ok"
          # Paystack and Flutterwave open their own checkout for a held seat (test keys).
          film=$(curl -fsS "$api/v1/showtimes" | jq -r 'max_by(.startsAt).id') # the furthest premiere: on sale and never 18+
          ps=$(curl -s -b "$jar" -H "Origin: $web" -H 'Content-Type: application/json' -d "{\"showtimeId\":\"$film\"}" "$web/api/pay/paystack")
          echo "$ps" | jq -e '.url | test("^https://checkout\\.paystack\\.com/")' >/dev/null || { echo "paystack start: $(echo "$ps" | jq -c '{error}')"; exit 1; }
          fl=$(curl -s -b "$jar" -H "Origin: $web" -H 'Content-Type: application/json' -d "{\"showtimeId\":\"$film\"}" "$web/api/pay/flutterwave")
          echo "$fl" | jq -e '.url | test("^https://checkout(-v2)?\\.flutterwave\\.com/")' >/dev/null || { echo "flutterwave start: $(echo "$fl" | jq -c '{error, url}')"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'verif-hash: wrong' -d '{}' "$web/api/flutterwave/webhook")" = 401 ] || { echo "flutterwave webhook accepts a wrong hash"; exit 1; }
          echo "local pay ok"
          curl -fsS "$web/browse?type=nollywood" | grep -q "Nollywood premieres"
          curl -fsS "$web/film/orbit-zero-2026-11-01" | grep -q "One screening, your local time"
          found=$(curl -fsS "$web/api/search?q=space%20film%20dubbed%20in%20Hausa")
          echo "search -> $found" | head -c 400; echo
          echo "$found" | grep -q '"hits":\[{"id"'
          echo "browse, film detail and search ok"
          curl -fsS -b "$jar" -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/auth/signout" >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/auth/me")" = 401 ]
          echo "accounts ok"
