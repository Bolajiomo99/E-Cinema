name: Deploy to Render

# Creates or updates the E-Cinema project on Render (workspace "E-Cinema" only).
on:
  workflow_dispatch:
  push:
    paths: [ops/render-deploy.mjs, .github/workflows/render-deploy.yml]

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create or update Render resources
        id: render
        run: node ops/render-deploy.mjs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY1 }}
          RENDER_OWNER_ID: tea-db7ej9e7bikc73ajmkmg
          DEPLOY_BRANCH: ${{ github.ref_name }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
          PAYPAL_WEBHOOK_ID: ${{ secrets.PAYPAL_WEBHOOK_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CHANNEL3_API_KEY: ${{ secrets.CHANNEL3_API_KEY }}
          NEXT_PUBLIC_AG_GRID_LICENSE_KEY: ${{ secrets.AG_GRID_LICENSE_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCOUNT_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCOUNT_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN1 }}
          TERMII_API_KEY: ${{ secrets.TERMII_API_KEY }}
          TERMII_SENDER_ID: ${{ secrets.TERMII_SENDER_ID }}
          SUMSUB_APP_TOKEN: ${{ secrets.SUMSUB_APP_TOKEN }}
          SUMSUB_SECRET_KEY: ${{ secrets.SUMSUB_SECRET_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # The public address: passkeys and Google sign-in are bound to it.
          WEBAUTHN_RP_ID: e-cinema.net
          WEBAUTHN_ORIGINS: https://e-cinema.net,https://www.e-cinema.net
          WEB_PUBLIC_URL: https://e-cinema.net
      - name: Smoke test the live services
        run: |
          curl -fsS "${{ steps.render.outputs.api_url }}/healthz"; echo
          curl -fsS "${{ steps.render.outputs.api_url }}/v1/showtimes" | head -c 300; echo
          # The web service can answer 502 for a short while after going live.
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.render.outputs.web_url }}/checkout")
            echo "checkout $code"
            [ "$code" = 200 ] && break
            [ "$i" = 18 ] && exit 1
            sleep 10
          done
          # Dub playback: the web app lists the AI dubs stored in R2 (may wait for a fresh deploy).
          for i in $(seq 1 30); do
            body=$(curl -s "${{ steps.render.outputs.web_url }}/api/dubs/red-earth-sample" || true)
            echo "dubs $body"
            echo "$body" | grep -q '"fr"' && break
            [ "$i" = 30 ] && exit 1
            sleep 10
          done
          # Accounts: sign up a throwaway viewer, read it back with the cookie, then sign out.
          web="${{ steps.render.outputs.web_url }}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$web/signin")
            echo "signin $code"
            [ "$code" = 200 ] && break
            [ "$i" = 30 ] && exit 1
            sleep 10
          done
          jar=$(mktemp)
          email="smoke+$(date +%s)@e-cinema.net"
          curl -fsS -c "$jar" -H "content-type: application/json" -H "origin: $web" \
            -d "{\"name\":\"Smoke Test\",\"email\":\"$email\",\"password\":\"smoke-$(openssl rand -hex 12)\",\"terms\":true}" \
            "$web/api/auth/signup" | grep -q '"account"'
          curl -fsS -b "$jar" "$web/api/auth/me" | grep -q "$email"
          curl -fsS -b "$jar" -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/auth/identity/token" | grep -q '"token"'
          echo "face check token ok"
          curl -fsS -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/auth/passkeys/login/begin" | grep -q '"challengeId"'
          echo "passkeys ok"
          # Google sign-in: once the client secrets exist, start must hand off to Google.
          if [ -n "${{ secrets.GOOGLE_CLIENT_ID }}" ]; then
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "https://e-cinema.net/api/auth/google/start")
            echo "google start -> ${loc%%\?*}"
            echo "$loc" | grep -q '^https://accounts.google.com/' || exit 1
            echo "$loc" | grep -q 'redirect_uri=https%3A%2F%2Fe-cinema.net%2Fapi%2Fauth%2Fgoogle%2Fcallback' || exit 1
          fi
          # Legal pages Google links to.
          curl -fsS -o /dev/null https://e-cinema.net/privacy
          curl -fsS -o /dev/null https://e-cinema.net/terms
          echo "google and legal ok"
          # Pages and the watch room: a viewer without a ticket sees the gate and gets no room pass.
          curl -fsS -o /dev/null https://e-cinema.net/
          curl -fsS -o /dev/null https://e-cinema.net/releases
          curl -fsS -b "$jar" "$web/room/red-earth-2026-11-02" | grep -q "for ticket holders"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" -H "origin: $web" -X POST "$web/api/rooms/red-earth-2026-11-02/pass")" = 403 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.render.outputs.api_url }}/v1/rooms/red-earth-2026-11-02/live?t=forged.pass")" = 401 ]
          echo "home, releases and watch room gate ok"
          curl -fsS -b "$jar" -H "content-type: application/json" -H "origin: $web" -d '{}' "$web/api/auth/signout" >/dev/null
          [ "$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" "$web/api/auth/me")" = 401 ]
          echo "accounts ok"
