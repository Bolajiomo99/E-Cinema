name: Database backup

# Nightly copy of the live database to Cloudflare R2, test-restored before it counts (Figma 50:469).
on:
  schedule:
    - cron: "0 0 * * *" # 01:00 Lagos
  workflow_dispatch:
  push:
    branches: [claude/project-thread-lbyrel]
    paths: [ops/db-backup.sh, .github/workflows/db-backup.yml]

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dump, test restore, upload to R2
        run: bash ops/db-backup.sh
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY1 }}
          RENDER_OWNER_ID: tea-db7ej9e7bikc73ajmkmg
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN1 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCOUNT_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCOUNT_TOKEN }}
