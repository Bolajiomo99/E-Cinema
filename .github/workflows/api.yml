name: API (Go)

on:
  push:
    paths: [api/**, .github/workflows/api.yml]
  pull_request:
    paths: [api/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecinema
          POSTGRES_PASSWORD: ecinema
          POSTGRES_DB: ecinema
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecinema" --health-interval 2s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Tests, including 300 buyers racing for 50 seats
        env:
          TEST_DATABASE_URL: postgres://ecinema:ecinema@localhost:5432/ecinema?sslmode=disable
        run: go test -race -count=1 ./...
      - run: go build -trimpath -o bin/api ./cmd/api
